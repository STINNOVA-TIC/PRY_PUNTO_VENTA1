services:
  # 1. Base de datos PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: pos_postgres_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: pointofsale
    ports:
      - "5432:5432"
    volumes:
      - pos_db_data:/var/lib/postgresql/data
      # Iniciar la base de datos con el esquema y datos semilla automáticamente
      - ./backend/db/script_pg.sql:/docker-entrypoint-initdb.d/01_init.sql

  # 2. Servidor Backend (NodeJS/Express/TS)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pos_backend_api
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: password123
      DB_NAME: pointofsale
      JWT_SECRET: st-innova2024
      JWT_EXPIRE: 7d
    ports:
      - "5000:5000"
    volumes:
      # Volumen para persistir las imágenes subidas por los usuarios
      - ./backend/img:/usr/src/app/img
    depends_on:
      - db

  # 3. Servidor Frontend (Vite/React + Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pos_frontend_web
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

  # 4. Servicio de Backup (Alpine + cron)
  backup:
    build:
      context: ./backup
      dockerfile: Dockerfile
    container_name: pos_backup
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      - ./backend/img:/data/img:ro   # Directorio de imágenes (solo lectura)
      - "C:/backups/pos:/backups"      # Almacén de backups en el host
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    entrypoint: [/bin/sh, /scripts/entrypoint.sh]

volumes:
  pos_db_data:
    driver: local
